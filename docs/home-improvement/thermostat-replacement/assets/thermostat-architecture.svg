<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    Thermostat Architecture - Single Pole Line Voltage
  </text>

  <!-- Electrical Panel -->
  <rect x="50" y="60" width="100" height="80" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    ELECTRICAL
  </text>
  <text x="100" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    PANEL
  </text>
  <text x="100" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    240V Double-Pole
  </text>
  <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Breaker
  </text>

  <!-- Thermostat -->
  <rect x="250" y="60" width="120" height="120" rx="5" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="310" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    THERMOSTAT
  </text>
  <text x="310" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    28A Single-Pole
  </text>

  <!-- Thermostat terminals -->
  <circle cx="270" cy="120" r="4" fill="#ff6b6b"/>
  <text x="280" y="125" font-family="Arial, sans-serif" font-size="9" fill="#333">LINE</text>

  <circle cx="270" cy="140" r="4" fill="#4ecdc4"/>
  <text x="280" y="145" font-family="Arial, sans-serif" font-size="9" fill="#333">LOAD</text>

  <circle cx="270" cy="160" r="4" fill="#95a5a6"/>
  <text x="280" y="165" font-family="Arial, sans-serif" font-size="9" fill="#333">GND</text>

  <circle cx="330" cy="120" r="4" fill="#feca57" stroke="#999" stroke-width="1"/>
  <text x="315" y="125" font-family="Arial, sans-serif" font-size="9" fill="#666">C1</text>

  <circle cx="330" cy="140" r="4" fill="#feca57" stroke="#999" stroke-width="1"/>
  <text x="315" y="145" font-family="Arial, sans-serif" font-size="9" fill="#666">C2</text>

  <!-- Heater Unit -->
  <rect x="450" y="60" width="100" height="80" rx="5" fill="#ffebee" stroke="#333" stroke-width="2"/>
  <text x="500" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    BASEBOARD
  </text>
  <text x="500" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    HEATER
  </text>
  <text x="500" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    240V Load
  </text>
  <text x="500" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    ~20A Draw
  </text>

  <!-- Power lines -->
  <!-- Hot 1 (Black) -->
  <line x1="150" y1="90" x2="270" y2="120" stroke="#000" stroke-width="3"/>
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="9" fill="#000">BLACK (Hot 1)</text>

  <!-- Hot 2 (Red) - switched by thermostat -->
  <line x1="270" y1="140" x2="450" y2="110" stroke="#ff0000" stroke-width="3"/>
  <text x="350" y="120" font-family="Arial, sans-serif" font-size="9" fill="#ff0000">RED (Hot 2)</text>

  <!-- Neutral/Return (White) - bypasses thermostat -->
  <line x1="150" y1="110" x2="450" y2="130" stroke="#808080" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="280" y="200" font-family="Arial, sans-serif" font-size="9" fill="#808080">WHITE (Neutral - Direct)</text>

  <!-- Ground (Bare/Green) -->
  <line x1="150" y1="130" x2="270" y2="160" stroke="#008000" stroke-width="2"/>
  <line x1="270" y1="160" x2="450" y2="150" stroke="#008000" stroke-width="2"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="9" fill="#008000">BARE COPPER (Ground)</text>

  <!-- Unused terminals (capped) -->
  <line x1="330" y1="120" x2="350" y2="120" stroke="#feca57" stroke-width="2"/>
  <line x1="330" y1="140" x2="350" y2="140" stroke="#feca57" stroke-width="2"/>
  <text x="355" y="125" font-family="Arial, sans-serif" font-size="8" fill="#666">Wire Nuts</text>
  <text x="355" y="135" font-family="Arial, sans-serif" font-size="8" fill="#666">(Capped)</text>

  <!-- Switch symbol in thermostat -->
  <line x1="290" y1="130" x2="310" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="125" x2="305" y2="135" stroke="#333" stroke-width="2"/>
  <circle cx="300" cy="130" r="2" fill="#333"/>

  <!-- Legend -->
  <rect x="50" y="280" width="500" height="100" fill="none" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Key Components:
  </text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Single-pole thermostat only switches ONE hot leg (Red wire)
  </text>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Black wire (Hot 1) always connects LINE to heater
  </text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • White neutral bypasses thermostat completely
  </text>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • C1/C2 terminals capped for future double-pole upgrade
  </text>
</svg>