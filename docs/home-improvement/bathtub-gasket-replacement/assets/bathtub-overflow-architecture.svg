<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    Bathtub Overflow System Architecture
  </text>

  <!-- Bathtub outline -->
  <rect x="50" y="60" width="500" height="200" rx="20" fill="#e6f3ff" stroke="#333" stroke-width="3"/>
  <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    BATHTUB
  </text>

  <!-- Water level -->
  <rect x="55" y="200" width="490" height="55" rx="15" fill="#b3d9ff" stroke="none"/>
  <text x="70" y="220" font-family="Arial, sans-serif" font-size="10" fill="#333">Normal Water Level</text>

  <!-- Overflow hole -->
  <circle cx="480" cy="160" r="25" fill="#fff" stroke="#333" stroke-width="3"/>
  <circle cx="480" cy="160" r="20" fill="#666"/>
  <text x="450" y="140" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">OVERFLOW HOLE</text>

  <!-- Cover plate -->
  <circle cx="480" cy="160" r="18" fill="#c0c0c0" stroke="#333" stroke-width="2"/>
  <circle cx="480" cy="160" r="2" fill="#333"/>
  <text x="420" y="125" font-family="Arial, sans-serif" font-size="9" fill="#666">Cover Plate</text>

  <!-- Gasket (behind plate) -->
  <circle cx="480" cy="160" r="22" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="3,2"/>
  <text x="420" y="115" font-family="Arial, sans-serif" font-size="9" fill="#ff6b6b">Gasket (behind)</text>

  <!-- Overflow pipe -->
  <rect x="470" y="180" width="20" height="80" fill="#ddd" stroke="#333" stroke-width="2"/>
  <text x="500" y="220" font-family="Arial, sans-serif" font-size="9" fill="#333">Overflow Pipe</text>

  <!-- Main drain -->
  <circle cx="300" cy="240" r="15" fill="#666" stroke="#333" stroke-width="2"/>
  <text x="320" y="245" font-family="Arial, sans-serif" font-size="9" fill="#333">Main Drain</text>

  <!-- Drain pipe -->
  <rect x="290" y="255" width="20" height="60" fill="#ddd" stroke="#333" stroke-width="2"/>

  <!-- Connection pipe -->
  <rect x="310" y="305" width="160" height="15" fill="#ddd" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="312" x2="470" y2="312" stroke="#333" stroke-width="1"/>

  <!-- P-trap -->
  <path d="M 200 320 Q 180 340 200 360 Q 220 380 240 360 Q 260 340 240 320"
        fill="#ddd" stroke="#333" stroke-width="2"/>
  <text x="200" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">P-Trap</text>

  <!-- Main sewer line -->
  <rect x="50" y="355" width="150" height="15" fill="#999" stroke="#333" stroke-width="2"/>
  <text x="125" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">To Sewer</text>

  <!-- Flow arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4169e1"/>
    </marker>
  </defs>

  <!-- Overflow flow -->
  <path d="M 460 160 Q 450 170 460 180" fill="none" stroke="#4169e1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="175" font-family="Arial, sans-serif" font-size="8" fill="#4169e1">Overflow Flow</text>

  <!-- Main drain flow -->
  <line x1="300" y1="255" x2="300" y2="280" stroke="#4169e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Combined flow -->
  <line x1="240" y1="320" x2="220" y2="340" stroke="#4169e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Component detail box -->
  <rect x="50" y="420" width="500" height="70" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="440" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Critical Components:
  </text>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Cover Plate: Chrome or plastic face plate with center screw
  </text>
  <text x="60" y="470" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Gasket: Rubber seal between overflow pipe and tub wall (prevents leaks)
  </text>
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Overflow Pipe: Direct connection to drain system, handles excess water
  </text>

  <!-- Failure indicators -->
  <text x="350" y="100" font-family="Arial, sans-serif" font-size="10" fill="#ff0000">⚠ Leak Points:</text>
  <circle cx="480" cy="180" r="3" fill="#ff0000"/>
  <text x="490" y="185" font-family="Arial, sans-serif" font-size="8" fill="#ff0000">Failed gasket</text>

  <circle cx="480" cy="260" r="3" fill="#ff0000"/>
  <text x="490" y="265" font-family="Arial, sans-serif" font-size="8" fill="#ff0000">Pipe connection</text>

  <!-- Water level indicators -->
  <line x1="60" y1="160" x2="440" y2="160" stroke="#ff9500" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="70" y="155" font-family="Arial, sans-serif" font-size="9" fill="#ff9500">Overflow Level</text>

  <line x1="60" y1="200" x2="440" y2="200" stroke="#4169e1" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="70" y="195" font-family="Arial, sans-serif" font-size="9" fill="#4169e1">Normal Level</text>
</svg>